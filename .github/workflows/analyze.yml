name: Analyze measured MES432 responses
on:
  push:
    paths: ['.github/workflows/analyze.yml','Tools/analyze_responses.py']
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MES432-impulse-responses
          run-id: 43789635177
          github-token: ${{ github.token }}
      - run: pip install numpy scipy
      - run: python Tools/analyze_responses.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MES432-curve-analysis
          path: validation/
