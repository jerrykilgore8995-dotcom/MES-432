name: MES-432 Windows VST3
on:
  push:
    paths: ['Source/**','CMakeLists.txt','.github/workflows/windows.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release --target MES432_VST3 --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: MES-432-Windows-x64-VST3
          path: build/MES432_artefacts/Release/VST3/
          if-no-files-found: error
